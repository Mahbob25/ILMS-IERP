<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{report_title}}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #000000;
            --gray-bg: #f7f7f7;
            --border-color: #333333;
        }

        @page {
            size: A4 portrait;
            margin: 12mm;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, Arial, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: #e5e7eb;
        }

        .report-container {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 12mm 10mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header-institute {
            font-size: 11px;
            line-height: 1.6;
            font-weight: 600;
        }

        .header-meta {
            text-align: left;
            font-size: 12px;
            line-height: 1.8;
            background-color: var(--gray-bg);
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            direction: ltr;
        }

        .doc-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 5px 0 6px 0;
        }

        .doc-subtitle {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin: 0 0 16px 0;
        }

        .caveat {
            background-color: #fff3cd;
            border: 1px solid #f0d27a;
            border-radius: 4px;
            color: #5c4400;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: right;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 20px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #999;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
            font-size: 12px;
        }

        thead th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            padding: 7px 8px;
            border: 1px solid var(--primary-color);
            text-align: center;
            white-space: nowrap;
        }

        tbody td {
            padding: 6px 8px;
            border: 1px solid #ccc;
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background-color: var(--gray-bg);
        }

        tbody tr:hover {
            background-color: #eef2ff;
        }

        td.empty {
            color: #999;
            font-weight: 600;
        }

        .footer {
            margin-top: 28px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
        }

        @media print {
            body {
                background-color: #fff;
                margin: 0;
                padding: 0;
            }
            .report-container {
                box-shadow: none;
                border: none;
                max-width: none;
                margin: 0 auto;
                padding: 0;
            }
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="report-container">

        <div class="header">
            <div class="header-institution">
                الجمهورية اليمنية<br>
                وزارة التعليم الفني والتدريب المهني<br>
                مكتب التعليم الفني والتدريب المهني - تعز<br>
                معهد الدراسات واللغات وعلوم الكمبيوتر
            </div>

            <div class="header-meta">
                تاريخ الإصدار: {{generated_at}}
            </div>
        </div>

        <div class="doc-title">{{report_title}}</div>

        {{subtitle_html}}

        {{caveat_html}}

        {{table_html}}

        <div class="footer">
            <span>أُصدر بواسطة نظام المعهد</span>
            <span>معهد الدراسات واللغات وعلوم الكمبيوتر — تعز</span>
        </div>

    </div>

</body>
</html>

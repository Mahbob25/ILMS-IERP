# Unified Docker Compose — works for local development AND production deploy.
#
#   Local:  docker compose up -d         (database + redis + backend + caddy)
#   Prod:   docker compose --profile tunnel up -d
#           (adds cloudflared; run from the server with a real .env)
#
# Environment variables are interpolated from the repo-root .env file.
# Every variable has a local-development default, so `docker compose up`
# works out of the box; production values come from .env on the server.
#
# Redis is the ONE shared instance for every backend (ERP realtime/queue,
# portal BFF cache/queue, ai-service). It is owned by this file so it shares
# the ERP's network + lifecycle; docker-compose.portal.yml must NOT declare
# its own `redis` service (a duplicate service name would collide on the
# `redis` network alias).

networks:
  lims-internal:
    name: lims-internal
    driver: bridge

services:
  database:
    image: pgvector/pgvector:pg16
    container_name: lims_database
    restart: always
    ports:
      - "5431:5432"
    environment:
      TZ: ${TIMEZONE:-Asia/Riyadh}
      POSTGRES_USER: ${POSTGRES_USER:-lims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lims_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lims}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lims-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lims}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Shared Redis — the single instance for the whole stack. The ERP uses it
  # for the realtime bus + queue (REDIS_URL), the portal BFF for its
  # read-through cache and ai:* queues, and ai-service as the job transport.
  # AOF persistence keeps queued jobs across restarts. Databases are
  # namespaced by key prefix, not by Redis DB index (all clients use /0).
  redis:
    image: redis:7-alpine
    container_name: lims_redis
    restart: always
    environment:
      TZ: ${TIMEZONE:-Asia/Riyadh}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lims_secure_redis_pass}
    # --requirepass is expanded by the container shell from REDIS_PASSWORD
    # (the `sh -c` layer is required: Compose's string form does NOT expand
    # variables, so the name would be passed to redis-server literally).
    # appendonly keeps the ai:* queues durable across restarts.
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - lims-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    build:
      context: ./apps/erp/backend
      dockerfile: Dockerfile
    container_name: lims_backend
    restart: always
    environment:
      TZ: ${TIMEZONE:-Asia/Riyadh}
      TIMEZONE: ${TIMEZONE:-Asia/Riyadh}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lims}:${POSTGRES_PASSWORD:-lims_secure_pass}@database:5432/${POSTGRES_DB:-lims}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local_dev_only_insecure_change_me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:3000,https://aldirasat.com,https://portal.aldirasat.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ERP_SERVICE_KEY: ${ERP_SERVICE_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://:lims_secure_redis_pass@redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-}
      PORTAL_SSO_SECRET: ${PORTAL_SSO_SECRET:-}
      PORTAL_FRONTEND_URL: ${PORTAL_FRONTEND_URL:-https://aldirasat-portal.vercel.app}
      BACKUP_DIR: /app/backups
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups:/app/backups
    networks:
      - lims-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  caddy:
    image: caddy:latest
    container_name: lims_caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: ${TIMEZONE:-Asia/Riyadh}
      # Service names — valid inside the compose network everywhere.
      # Caddy proxies /api/v1, /uploads -> backend and /api/* -> portal-backend.
      BACKEND_URL: backend:8000
      PORTAL_BACKEND_URL: portal-backend:8001
    networks:
      - lims-internal
    depends_on:
      backend:
        condition: service_healthy
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Production only — start with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lims_cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks:
      - lims-internal
    depends_on:
      - caddy

volumes:
  pgdata:
  redis_data:
  uploads_data:
  backups:
  caddy_data:
  caddy_config:

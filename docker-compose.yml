  caddy:
    image: caddy:latest
    container_name: lims_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Riyadh
      BACKEND_URL: "${BACKEND_URL:-host.docker.internal:8000}"
      FRONTEND_URL: "${FRONTEND_URL:-host.docker.internal:3000}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
    networks:
      - lims-internal
    depends_on:
      - database
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  lims-internal:
    driver: bridge

services:
  database:
    image: pgvector/pgvector:pg16
    container_name: lims_database
    restart: always
    ports:
      - "5431:5432"
    environment:
      TZ: Asia/Riyadh
      POSTGRES_USER: ${POSTGRES_USER:-lims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lims_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lims}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lims-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ──────────────────────────────────────────────────────────────
  # Backend and Frontend are commented out for local development.

<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', 'Arial', sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .certificate {
    width: 800px;
    max-width: 100%;
    background: #fff;
    border: 3px solid #1e293b;
    padding: 60px 50px;
    text-align: center;
    position: relative;
  }

  .certificate::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    bottom: 8px;
    border: 1px solid #cbd5e1;
    pointer-events: none;
  }

  .institution {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #64748b;
    margin-bottom: 40px;
  }

  .title {
    font-size: 36px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 16px;
    color: #64748b;
    margin-bottom: 10px;
  }

  .student-name {
    font-size: 32px;
    font-weight: 700;
    color: #0f172a;
    margin: 30px 0;
    padding: 15px 0;
    border-top: 2px solid #e2e8f0;
    border-bottom: 2px solid #e2e8f0;
  }

  .course-name {
    font-size: 20px;
    color: #334155;
    margin-bottom: 40px;
  }

  .details {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 40px;
    font-size: 13px;
    color: #64748b;
  }

  .details span {
    display: block;
  }

  .details strong {
    display: block;
    color: #1e293b;
    font-size: 14px;
    margin-top: 4px;
  }

  .seal {
    margin-top: 50px;
    width: 80px;
    height: 80px;
    border: 2px solid #1e293b;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #1e293b;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="certificate">
    <div class="institution">Languages Computer Science and Studies Institute</div>
    <div class="title">شهادة إتمام</div>
    <div class="subtitle">يُمنح لـ</div>
    <div class="student-name">alaaa</div>
    <div class="course-name">المقرر: <strong>Section Course 1783207282628</strong></div>
    <div class="details">
      <div>رقم الشهادة <strong>CERT-2026-000001</strong></div>
      <div>تاريخ الإصدار <strong>2026-07-05</strong></div>
    </div>
    <div class="seal">معهد LCS</div>
    <div class="footer">معهد اللغات وعلوم الحاسب والدراسات</div>
  </div>
</body>
</html>

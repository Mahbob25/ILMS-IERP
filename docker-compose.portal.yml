# Portal + AI compose — joins the ERP `lims-internal` network.
#   Local:  docker compose -f docker-compose.portal.yml up -d
#   Prod:   same command on the VM (after `docker compose up -d` for the ERP)
#
# Principle: Redis is ONE shared instance owned by docker-compose.yml
# (service `redis`, container `lims_redis`). This file must NOT declare its
# own `redis` service — a duplicate service name would collide on the `redis`
# network alias and the two instances would fight over the same volume.
# Start the ERP stack first so Redis exists before these services connect.
# No host `ports:` on portal/ai — Caddy is the sole ingress.

networks:
  lims-internal:
    external: true

services:
  portal-backend:
    build: ./apps/portal/backend
    container_name: portal_backend
    restart: always
    environment:
      TZ: ${TIMEZONE:-Asia/Riyadh}
      TIMEZONE: ${TIMEZONE:-Asia/Riyadh}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-}
      PORTAL_SSO_SECRET: ${PORTAL_SSO_SECRET:-}
      # Same PG host as the ERP — the BFF only reads/writes portal.* directly
      # (portal.users, portal.refresh_tokens) and reaches erp.* via the ERP
      # internal API (http://backend:8000). search_path defaults to the public
      # schema; queries are fully qualified (portal.users etc.).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lims}:${POSTGRES_PASSWORD:-lims_secure_pass}@database:5432/${POSTGRES_DB:-lims}
      ERP_INTERNAL_URL: http://backend:8000
      ERP_SERVICE_KEY: ${ERP_SERVICE_KEY:-}
      # Shared Redis (owned by docker-compose.yml). The URL carries the
      # password; scripts/setup.sh writes it to .env. The default matches the
      # redis service's fallback password so a no-.env `up` still works.
      REDIS_URL: ${REDIS_URL:-redis://:lims_secure_redis_pass@redis:6379/0}
      CACHE_TTL_SECONDS: 60
      SENTRY_DSN: ${SENTRY_DSN:-}
    # NOTE: no `depends_on: redis` — `redis` lives in the ERP compose file,
    # and depends_on only reaches services in the same project. Ordering is
    # handled by starting the ERP stack first (scripts/setup.sh); the BFF
    # degrades gracefully if Redis is briefly unavailable.
    networks:
      - lims-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  ai-service:
    build: ./apps/ai-service
    container_name: ai_service
    restart: always
    environment:
      REDIS_URL: ${REDIS_URL:-redis://:lims_secure_redis_pass@redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - lims-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

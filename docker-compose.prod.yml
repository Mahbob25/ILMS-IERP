networks:
  lims-internal:
    driver: bridge

services:
  database:
    image: pgvector/pgvector:pg16
    container_name: lims_database
    restart: always
    environment:
      TZ: Asia/Riyadh
      POSTGRES_USER: ${POSTGRES_USER?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?err}
      POSTGRES_DB: ${POSTGRES_DB:-lims}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lims-internal
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lims}"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lims_backend
    restart: always
    environment:
      TZ: Asia/Riyadh
      TIMEZONE: Asia/Riyadh
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER?err}:${POSTGRES_PASSWORD?err}@database:5432/${POSTGRES_DB:-lims}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY?err}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://aldrasat.edu}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      database: { condition: service_healthy }
    networks:
      - lims-internal
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lims_frontend
    restart: always
    environment:
      TZ: Asia/Riyadh
      NEXT_PUBLIC_API_URL: https://aldrasat.edu/api/v1
    depends_on:
      backend: { condition: service_healthy }
    networks:
      - lims-internal
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ar/login"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:latest
    container_name: lims_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: Asia/Riyadh
      BACKEND_URL: backend:8000
      FRONTEND_URL: frontend:3000
    networks:
      - lims-internal
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

volumes:
  pgdata:
  caddy_data:
  caddy_config:

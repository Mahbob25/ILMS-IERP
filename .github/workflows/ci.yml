name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lims_test
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          pip install -r apps/erp/backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run alembic migrations
        run: alembic upgrade head
        working-directory: apps/erp/backend
        env:
          DATABASE_URL: postgresql+asyncpg://lims:lims_test@localhost:5432/lims_test
          JWT_SECRET_KEY: ci_test_key_not_used_in_production_do_not_use
      - name: Run backend tests
        run: pytest -v --cov=app --cov-report=term-missing
        working-directory: apps/erp/backend
        env:
          DATABASE_URL: postgresql+asyncpg://lims:lims_test@localhost:5432/lims_test
          JWT_SECRET_KEY: ci_test_key_not_used_in_production_do_not_use
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/erp/frontend
      - name: Run frontend lint
        run: npm run lint
        working-directory: apps/erp/frontend
      - name: Build frontend
        run: npm run build
        working-directory: apps/erp/frontend
        env:
          NEXT_PUBLIC_SENTRY_DSN: ""

      # ── Portal (apps/portal/backend + apps/portal/frontend) ─────────
      - name: Install portal backend dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
        working-directory: apps/portal/backend
      - name: Run portal backend tests (unit)
        run: pytest -v
        working-directory: apps/portal/backend
        env:
          PORTAL_JWT_SECRET: ci_test_portal_jwt_secret_12345678901234567890123456789012
          REDIS_URL: ""
          ERP_SERVICE_KEY: ci_test_service_key
      - name: Install portal frontend dependencies
        run: npm ci
        working-directory: apps/portal/frontend
      - name: Typecheck portal frontend
        run: npx tsc --noEmit
        working-directory: apps/portal/frontend
      - name: Build portal frontend
        run: npm run build
        working-directory: apps/portal/frontend

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /home/ubuntu/ILMS-IERP
            git pull --ff-only
            bash scripts/setup.sh --skip-pull
